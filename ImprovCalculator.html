<!DOCTYPE html>
<html lang="en">
<head>
  <title>Calculator</title>
</head>
<body>
  <p> Calculator</p>
  <p>
  <button onclick="
    Update('1');">
    1
  </button>
  <button onclick="
    Update('2');">
    2
  </button>
  <button onclick="
    Update('3');">
    3
  </button>
  <button onclick="
    Update('+');">
    +
  </button>
  </p>

  <p>
  <button onclick="
    Update('4');">
    4
  </button>
  <button onclick="
    Update('5');">
    5
  </button>
  <button onclick="
    Update('6');">
    6
  </button>
  <button onclick="
    Update('-');">
    -
  </button>
  </p>

  <p>
  <button onclick="
    Update('7');">
    7
  </button>
  <button onclick="
    Update('8');">
    8
  </button>
  <button onclick="
    Update('9');">
    9
  </button>
  <button onclick="
    Update('*');">
    *
  </button>
  </p>

  <p>
  <button onclick="
    Update('0');">
    0
  </button>
  <button onclick="
    Update('.');">
    .
  </button>
  <button onclick="
     calc=eval(calc);
    console.log(calc);">
    =
  </button>
  <button onclick="
    Update('/');">
    /
  </button>
  </p>
  <button onclick="calc='';
  localStorage.removeItem('calc');
  console.log('Cleared');">Clear</button>
  <script>
    let calc=JSON.parse(localStorage.getItem('calc')) || '';
    function Update(value){
      calc+=value;
      console.log(calc);
      localStorage.setItem('calc',JSON.stringify(calc));
    }
  </script>
</body>
</html>
