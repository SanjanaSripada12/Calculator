<!DOCTYPE html>
<html lang="en">
<head>
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <p> Calculator</p>
  <p class="js-result"></p>
  <p>
  <button class="num-key" onclick="
    Update('1');">
    1
  </button>
  <button class="num-key" onclick="
    Update('2');">
    2
  </button>
  <button class="num-key" onclick="
    Update('3');">
    3
  </button>
  <button class="sym-key" onclick="
    Update('+');">
    +
  </button>
  </p>

  <p>
  <button class="num-key" onclick="
    Update('4');">
    4
  </button>
  <button class="num-key" onclick="
    Update('5');">
    5
  </button>
  <button class="num-key" onclick="
    Update('6');">
    6
  </button>
  <button class="sym-key" onclick="
    Update('-');">
    -
  </button>
  </p>

  <p>
  <button class="num-key" onclick="
    Update('7');">
    7
  </button>
  <button class="num-key" onclick="
    Update('8');">
    8
  </button>
  <button class="num-key" onclick="
    Update('9');">
    9
  </button>
  <button class="sym-key" onclick="
    Update('*');">
    *
  </button>
  </p>

  <p>
  <button class="num-key" onclick="
    Update('0');">
    0
  </button>
  <button class="num-key" onclick="
    Update('.');">
    .
  </button>
  <button class="num-key" onclick="
     calc=eval(calc);
    display();
    localStorage.setItem('calc',calc);">
    =
  </button>
  <button class="sym-key" onclick="
    Update('/');">
    /
  </button>
  </p>
  <button class="clear-key" onclick="calc='';
  localStorage.removeItem('calc');
  display();
  ">Clear</button>
  <script src="script.js">
  </script>
</body>
</html>
